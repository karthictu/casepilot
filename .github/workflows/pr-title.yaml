name: pr-title

# PR titles become squash-merge commit messages, so they must follow Conventional Commits.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            chore
            ci
            build
          scopes: |
            api
            admin
            agents
            runtime
            protocols
            temporal
            docs
            ci
            deps
          requireScope: false
