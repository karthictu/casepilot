[project]
name = "casepilot-api"
version = "0.1.0"
description = "casepilot API — case-driven agent automation with human-in-the-loop, exposed over REST, A2A, MCP and AG-UI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
# Every external integration is optional and off by default — the base install runs fully offline on mocks.
adk = ["google-adk>=2.0,<3.0"]
litellm = ["litellm>=1.80"]
langfuse = ["langfuse>=4.0,<5.0"]
mem0 = ["mem0ai>=2.0"]
temporal = ["temporalio>=1.27"]
all = ["casepilot-api[adk,litellm,langfuse,mem0,temporal]"]

[dependency-groups]
dev = [
    "pyyaml>=6.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore:.*EXPERIMENTAL.*:UserWarning"]
markers = [
    "integration: needs an optional extra (adk, temporal, ...) — skipped when it is not installed",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
